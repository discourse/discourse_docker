# This template adds the 'tiny_tds' gem for import scripts depending on it

params:
  home: /var/www/discourse

hooks:
  after_web_config:
    - exec:
        cmd:
          - apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends freetds-dev

  after_bundle_exec:
    - exec:
        cd: $home
        cmd:
          - echo "gem 'tiny_tds'" >> Gemfile
          - su discourse -c 'bundle config unset deployment'
          - su discourse -c 'bundle config set --local frozen false'
          - su discourse -c 'bundle install --jobs $(nproc --ignore=1)'
